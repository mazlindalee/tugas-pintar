<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — Enterprise Task Management</title><style>
:root{--navy:#10233f;--blue:#2563eb;--ink:#182230;--muted:#718096;--line:#e5e9f0;--bg:#f4f6f9;--green:#16845b;--amber:#b7791f;--red:#c2413b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.shell{min-height:100vh;display:flex}.side{width:240px;background:var(--navy);color:#c8d3e1;padding:24px 16px;flex-shrink:0}.brand{font-size:20px;font-weight:800;color:#fff;padding:8px 10px 28px}.brand b{color:#70a1ff}.navlabel{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#8092aa;padding:0 11px 9px}.nav button{display:block;width:100%;border:0;background:none;color:#b9c6d7;text-align:left;padding:11px;border-radius:8px;cursor:pointer;margin:3px 0}.nav button.active,.nav button:hover{background:#1d3a63;color:#fff}.main{flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 32px}.crumb{font-size:13px;color:var(--muted)}.profile{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#dbe7ff;color:#2454a6}.content{max-width:1250px;margin:auto;padding:30px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:1.4px}.head h1{margin:5px 0;font-size:30px}.head p{margin:0;color:var(--muted);font-size:13px}.primary{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.value{font-size:25px;font-weight:800;margin-top:6px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.search{width:210px;border:1px solid var(--line);border-radius:7px;padding:9px 10px}.filter{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;font-size:12px;cursor:pointer}.filter.active{background:#edf4ff;border-color:#b8cdf8;color:#1e5bc6;font-weight:700}.form{background:#fafbfc;border-bottom:1px solid var(--line);padding:15px 18px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:7px}.form input,.form select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:10px;outline:none}.tasks{display:grid}.task{display:grid;grid-template-columns:28px 1.8fr .9fr .9fr .9fr 70px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #eef1f5}.task:last-child{border:0}.tasktitle{font-size:13px;font-weight:700}.task.done .tasktitle{text-decoration:line-through;color:#98a2b1}.meta{font-size:10px;color:var(--muted);margin-top:4px}.check{accent-color:var(--blue)}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:800;text-transform:uppercase}.high{background:#fdebea;color:var(--red)}.medium{background:#fff5dc;color:var(--amber)}.low{background:#eaf5ff;color:#2563eb}.completed{background:#e8f7f0;color:var(--green)}.open{background:#fff5dc;color:var(--amber)}.dept{font-size:11px;color:#4d5b6e}.due{font-size:11px}.overdue{color:var(--red);font-weight:700}.actions button{border:0;background:none;color:var(--red);font-size:11px;cursor:pointer}.empty{text-align:center;padding:42px;color:var(--muted);font-size:13px}.foot{text-align:right;color:#98a2b1;font-size:10px;padding:16px 2px}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.form{grid-template-columns:2fr 1fr 1fr}.form button{grid-column:1/-1}.task{grid-template-columns:25px 1.5fr 1fr 1fr 1fr 55px}}@media(max-width:760px){.side{display:none}.content{padding:18px 12px}.top{padding:0 15px}.head{align-items:flex-start;gap:15px;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.panelhead{align-items:flex-start;flex-direction:column}.search{width:100%}.form{grid-template-columns:1fr}.task{grid-template-columns:25px 1fr auto}.task .dept,.task .prioritycol{display:none}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">Task<b>Flow</b></div><div class="navlabel">Workspace</div><div class="nav"><button class="active">Dashboard</button><button>My Tasks</button><button>Completed</button><button>Reports</button></div></aside><main class="main"><header class="top"><span class="crumb">Workspace / Enterprise Dashboard</span><div class="profile">Linda Lee <span class="avatar">LL</span></div></header><section class="content"><div class="head"><div><div class="eyebrow">Executive workspace</div><h1>Task Management</h1><p>Urus tugasan, keutamaan, pemilik dan tarikh akhir pasukan.</p></div><button class="primary" onclick="document.getElementById('input').focus()">+ New task</button></div><div class="stats"><div class="stat"><div class="label">Total tasks</div><div class="value" id="total">0</div></div><div class="stat"><div class="label">Open</div><div class="value" id="open">0</div></div><div class="stat"><div class="label">Completed</div><div class="value" id="done">0</div></div><div class="stat"><div class="label">Overdue</div><div class="value" id="overdue">0</div></div><div class="stat"><div class="label">Completion</div><div class="value" id="rate">0%</div></div></div><section class="panel"><div class="panelhead"><strong>Task register</strong><div class="toolbar"><input id="search" class="search" placeholder="Search task, owner, department..." oninput="render()"><button class="filter active" onclick="setFilter('all',this)">All</button><button class="filter" onclick="setFilter('open',this)">Open</button><button class="filter" onclick="setFilter('done',this)">Completed</button></div></div><div class="form"><input id="input" placeholder="Task description"><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select><input id="assignee" placeholder="Assignee"><select id="department"><option>Management</option><option>Finance</option><option>HR</option><option>Marketing</option><option>Operations</option><option>IT</option></select><input id="due" type="date"><button class="primary" onclick="addTask()">Add task</button></div><div class="tasks" id="tasks"></div></section><div class="foot">TaskFlow Enterprise · Internal use</div></section></main></div><script>
let tasks=JSON.parse(localStorage.getItem('todo-tasks')||'[]'),filter='all';const today=new Date();function save(){localStorage.setItem('todo-tasks',JSON.stringify(tasks))}function addTask(){const text=input.value.trim();if(!text)return;tasks.unshift({id:Date.now(),text,done:false,priority:priority.value,assignee:assignee.value.trim()||'Unassigned',department:department.value,due:due.value});input.value='';assignee.value='';due.value='';save();render();input.focus()}function toggle(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()}function remove(id){tasks=tasks.filter(t=>t.id!==id);save();render()}function setFilter(f,el){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function overdue(t){return !t.done&&t.due&&new Date(t.due+'T23:59:59')<today}function render(){const q=search.value.toLowerCase();const shown=tasks.filter(t=>(filter==='all'||(filter==='done'?t.done:!t.done))&&[t.text,t.assignee,t.department].join(' ').toLowerCase().includes(q));tasksEl=document.getElementById('tasks');tasksEl.innerHTML=shown.length?shown.map(t=>`<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"><div><div class="tasktitle">${esc(t.text)} <span class="pill ${t.done?'completed':'open'}">${t.done?'Completed':'Open'}</span></div><div class="meta">Owner: ${esc(t.assignee)}</div></div><div class="prioritycol"><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span></div><div class="dept">${esc(t.department)}</div><div class="due ${overdue(t)?'overdue':''}">${t.due?new Date(t.due+'T00:00:00').toLocaleDateString('en-GB'):'No due date'}${overdue(t)?' · OVERDUE':''}</div><div class="actions"><button onclick="remove(${t.id})">Delete</button></div></div>`).join(''):'<div class="empty">No tasks found. Create a task to get started.</div>';const total=tasks.length,complete=tasks.filter(t=>t.done).length;document.getElementById('total').textContent=total;document.getElementById('open').textContent=total-complete;document.getElementById('done').textContent=complete;document.getElementById('overdue').textContent=tasks.filter(overdue).length;document.getElementById('rate').textContent=total?Math.round(complete/total*100)+'%':'0%'}input.addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});render();</script></body></html>
