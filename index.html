<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>To-Do List</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#172033}.app{max-width:760px;margin:60px auto;padding:24px}.card{background:white;border-radius:24px;padding:32px;box-shadow:0 12px 40px #17203312}h1{margin:0 0 8px;font-size:34px}.sub{color:#6b7280;margin-bottom:28px}.form{display:flex;gap:10px}.form input{flex:1;padding:14px 16px;border:1px solid #dbe1ea;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}.filters{display:flex;gap:8px;margin:22px 0}.filter{border:1px solid #dbe1ea;background:white;border-radius:10px;padding:8px 14px;cursor:pointer}.filter.active{background:#eef2ff;border-color:#818cf8;color:#4338ca}.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid #e5e7eb;border-radius:14px}.task.done .text{text-decoration:line-through;color:#9ca3af}.text{flex:1}.delete{border:0;background:transparent;color:#ef4444;cursor:pointer;font-size:18px}.empty{text-align:center;color:#9ca3af;padding:30px}.count{font-size:13px;color:#6b7280;margin-top:18px}@media(max-width:600px){.app{margin:20px auto;padding:12px}.card{padding:22px}.form{flex-direction:column}.btn{width:100%}}
</style></head>
<body><main class="app"><section class="card"><h1>Senarai Tugasan</h1><div class="sub">Urus tugasan harian anda dengan mudah.</div><div class="form"><input id="input" placeholder="Contoh: Siapkan tugasan matematik..." autofocus><button class="btn" onclick="addTask()">+ Tambah</button></div><div class="filters"><button class="filter active" onclick="setFilter('all',this)">Semua</button><button class="filter" onclick="setFilter('active',this)">Belum siap</button><button class="filter" onclick="setFilter('done',this)">Siap</button></div><div id="tasks" class="tasks"></div><div id="count" class="count"></div></section></main>
<script>
let tasks=JSON.parse(localStorage.getItem('todo-tasks')||'[]'),filter='all';
function save(){localStorage.setItem('todo-tasks',JSON.stringify(tasks))}
function addTask(){const input=document.getElementById('input'),text=input.value.trim();if(!text)return;tasks.unshift({id:Date.now(),text,done:false});input.value='';save();render();input.focus()}
function toggle(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()}
function remove(id){tasks=tasks.filter(t=>t.id!==id);save();render()}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function render(){const box=document.getElementById('tasks');let shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));box.innerHTML=shown.length?shown.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"><span class="text">${escapeHtml(t.text)}</span><button class="delete" onclick="remove(${t.id})" aria-label="Padam">×</button></div>`).join(''):'<div class="empty">Tiada tugasan di sini 🎉</div>';document.getElementById('count').textContent=`${tasks.filter(t=>!t.done).length} tugasan belum siap`}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});render();
</script></body></html>
